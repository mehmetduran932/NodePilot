name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build Desktop on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'windows-x64'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macos-arm64'
          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            name: 'macos-x64'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build CLI & Shim
        run: cargo build --release --target ${{ matrix.target }} -p nodepilot -p nodepilot-shim

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NodePilot ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for release details.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
