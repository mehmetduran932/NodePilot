name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-cli:
    name: Build & Package ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            archive_name: 'nodepilot-windows-x64.zip'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            archive_name: 'nodepilot-macos-arm64.tar.gz'
          # Intel binary is cross-compiled on Apple Silicon; the macos-13 runner image was retired
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            archive_name: 'nodepilot-macos-x64.tar.gz'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI & Shim Binaries
        run: cargo build --release --target ${{ matrix.target }} -p nodepilot -p nodepilot-shim

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/nodepilot.exe", "target/${{ matrix.target }}/release/nodepilot-shim.exe", "README.md", "LICENSE", "SECURITY.md" -DestinationPath "${{ matrix.archive_name }}"

      - name: Package Unix Artifacts
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/nodepilot .
          cp target/${{ matrix.target }}/release/nodepilot-shim .
          tar -czvf "${{ matrix.archive_name }}" nodepilot nodepilot-shim README.md LICENSE SECURITY.md

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive_name }}
          generate_release_notes: true
